type: bug
displayName: Bug
displayNamePlural: Bugs
icon: bug_report
color: '#dc2626'
modes:
  inline: true
  fullDocument: false
idPrefix: bug
idFormat: ulid
fields:
  - name: title
    type: string
    required: true
    displayInline: true
  - name: status
    type: select
    required: false
    default: to-do
    displayInline: true
    options:
      - value: to-do
        label: To Do
        icon: circle
        category: unstarted
      - value: in-progress
        label: In Progress
        icon: motion_photos_on
        category: started
      - value: in-review
        label: In Review
        icon: rate_review
        color: '#3b82f6'
        category: started
      - value: changes-requested
        label: Changes Requested
        icon: edit_note
        color: '#f97316'
        category: started
      - value: approved
        label: Approved
        icon: verified
        color: '#22c55e'
        category: started
      - value: done
        label: Done
        icon: check_circle
        category: done
      - value: wont-do
        label: Won't Do
        icon: do_not_disturb_on
        color: '#64748b'
        category: cancelled
      - value: duplicate
        label: Duplicate
        icon: content_copy
        color: '#64748b'
        category: cancelled
  - name: priority
    type: select
    required: false
    default: medium
    displayInline: true
    options:
      - value: low
        label: Low
      - value: medium
        label: Medium
      - value: high
        label: High
      - value: critical
        label: Critical
  - name: owner
    type: user
    required: false
    displayInline: true
  - name: description
    type: text
    required: false
    displayInline: true
  - name: collection
    type: relationship
    required: false
    displayInline: true
    relationshipTypeKey: in-collection
    targetTrackerTypes:
      - milestone
      - release
    multiValue: true
    inverseFieldId: items
    inverseRelationshipTypeKey: has-item
  - name: goal
    type: relationship
    required: false
    displayInline: true
    relationshipTypeKey: contributed-by
    targetTrackerTypes:
      - goal
    multiValue: true
    inverseFieldId: contributes
    inverseRelationshipTypeKey: contributes-to
  - name: tags
    type: array
    required: false
    displayInline: false
    itemType: string
inlineTemplate: '{icon} {title} {status} {priority}'
roles:
  title: title
  workflowStatus: status
  priority: priority
  assignee: owner
  tags: tags
sharing: team
draftByDefault: false
